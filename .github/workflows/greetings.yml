name: Greetings
on: [pull_request]

permissions:
  pull-requests: write

jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: "👋 Thanks for opening your first issue! We appreciate your contribution and will review it soon."
          pr-message: "🎉 Thanks for submitting your first pull request! We value your effort and a maintainer will review it shortly."
